<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73"/>
      <stop offset="50%" stop-color="#E6B325"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Sleek dark background -->
  <rect width="500" height="500" fill="#0A0B0E" rx="100"/>
  
  <g filter="url(#glow)">
    <!-- Outer delicate pod outline -->
    <path d="M250 70 C 420 70 430 250 430 250 C 430 250 420 430 250 430 C 80 430 70 250 70 250 C 70 250 80 70 250 70 Z" fill="none" stroke="url(#gold)" stroke-width="12"/>
    
    <!-- Inner solid seed/leaf shape -->
    <path d="M250 70 C 360 150 360 350 250 430 C 140 350 140 150 250 70 Z" fill="url(#gold)" opacity="0.95"/>
    
    <!-- Negative space center stem line -->
    <path d="M250 70 L250 430" stroke="#0A0B0E" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Elegant center detail -->
    <circle cx="250" cy="250" r="45" fill="#0A0B0E"/>
    <circle cx="250" cy="250" r="18" fill="url(#gold)"/>
    
    <!-- Subtle accent dots -->
    <circle cx="250" cy="150" r="8" fill="#0A0B0E"/>
    <circle cx="250" cy="350" r="8" fill="#0A0B0E"/>
  </g>
</svg>